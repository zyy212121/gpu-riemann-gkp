<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #263442; }
      .panel { fill: #ffffff; stroke: #9aa7b5; stroke-width: 2; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 21px; font-weight: 700; }
      .label { font-size: 19px; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .array { font-size: 25px; font-weight: 600; letter-spacing: 3px; }
      .cell0 { fill: #e9f5ef; stroke: #3d8a68; stroke-width: 2; }
      .cell1 { fill: #f1ecf8; stroke: #8063a3; stroke-width: 2; }
      .cell2 { fill: #e8f2fa; stroke: #4b7fae; stroke-width: 2; }
      .neutral { fill: #f5f7f9; stroke: #8795a5; stroke-width: 2; }
      .arrow { fill: none; stroke: #536477; stroke-width: 3; marker-end: url(#arrowhead); }
      .guide { fill: none; stroke: #778899; stroke-width: 2; stroke-dasharray: 7 6; }
      .cell0Text { fill: #267253; }
      .cell1Text { fill: #6c4e91; }
      .cell2Text { fill: #326b9f; }
      .whiteText { fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#536477"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1000" fill="#ffffff"/>

  <!-- 1. Particle ownership -->
  <rect class="panel" x="40" y="40" width="650" height="545" rx="8"/>
  <text class="title" x="70" y="85">1  Particle-to-cell ownership</text>

  <g aria-label="particle cards">
    <rect class="cell2" x="75" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="116" y="148" text-anchor="middle">A</text>
    <text class="small cell2Text" x="116" y="176" text-anchor="middle">Cell 2</text>

    <rect class="cell0" x="174" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="215" y="148" text-anchor="middle">B</text>
    <text class="small cell0Text" x="215" y="176" text-anchor="middle">Cell 0</text>

    <rect class="cell2" x="273" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="314" y="148" text-anchor="middle">C</text>
    <text class="small cell2Text" x="314" y="176" text-anchor="middle">Cell 2</text>

    <rect class="cell1" x="372" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="413" y="148" text-anchor="middle">D</text>
    <text class="small cell1Text" x="413" y="176" text-anchor="middle">Cell 1</text>

    <rect class="cell0" x="471" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="512" y="148" text-anchor="middle">E</text>
    <text class="small cell0Text" x="512" y="176" text-anchor="middle">Cell 0</text>

    <rect class="cell2" x="570" y="120" width="82" height="70" rx="6"/>
    <text class="subtitle" x="611" y="148" text-anchor="middle">F</text>
    <text class="small cell2Text" x="611" y="176" text-anchor="middle">Cell 2</text>
  </g>

  <text class="subtitle" x="70" y="235">Cell–particle incidence</text>
  <g aria-label="incidence matrix">
    <text class="small" x="250" y="270" text-anchor="middle">A</text>
    <text class="small" x="316" y="270" text-anchor="middle">B</text>
    <text class="small" x="382" y="270" text-anchor="middle">C</text>
    <text class="small" x="448" y="270" text-anchor="middle">D</text>
    <text class="small" x="514" y="270" text-anchor="middle">E</text>
    <text class="small" x="580" y="270" text-anchor="middle">F</text>

    <text class="small cell0Text" x="185" y="313" text-anchor="end">Cell 0</text>
    <text class="small cell1Text" x="185" y="379" text-anchor="end">Cell 1</text>
    <text class="small cell2Text" x="185" y="445" text-anchor="end">Cell 2</text>

    <!-- row 0 -->
    <rect class="neutral" x="218" y="282" width="64" height="54" rx="4"/><text class="small" x="250" y="316" text-anchor="middle">0</text>
    <rect class="cell0" x="284" y="282" width="64" height="54" rx="4"/><text class="subtitle cell0Text" x="316" y="317" text-anchor="middle">1</text>
    <rect class="neutral" x="350" y="282" width="64" height="54" rx="4"/><text class="small" x="382" y="316" text-anchor="middle">0</text>
    <rect class="neutral" x="416" y="282" width="64" height="54" rx="4"/><text class="small" x="448" y="316" text-anchor="middle">0</text>
    <rect class="cell0" x="482" y="282" width="64" height="54" rx="4"/><text class="subtitle cell0Text" x="514" y="317" text-anchor="middle">1</text>
    <rect class="neutral" x="548" y="282" width="64" height="54" rx="4"/><text class="small" x="580" y="316" text-anchor="middle">0</text>
    <!-- row 1 -->
    <rect class="neutral" x="218" y="348" width="64" height="54" rx="4"/><text class="small" x="250" y="382" text-anchor="middle">0</text>
    <rect class="neutral" x="284" y="348" width="64" height="54" rx="4"/><text class="small" x="316" y="382" text-anchor="middle">0</text>
    <rect class="neutral" x="350" y="348" width="64" height="54" rx="4"/><text class="small" x="382" y="382" text-anchor="middle">0</text>
    <rect class="cell1" x="416" y="348" width="64" height="54" rx="4"/><text class="subtitle cell1Text" x="448" y="383" text-anchor="middle">1</text>
    <rect class="neutral" x="482" y="348" width="64" height="54" rx="4"/><text class="small" x="514" y="382" text-anchor="middle">0</text>
    <rect class="neutral" x="548" y="348" width="64" height="54" rx="4"/><text class="small" x="580" y="382" text-anchor="middle">0</text>
    <!-- row 2 -->
    <rect class="cell2" x="218" y="414" width="64" height="54" rx="4"/><text class="subtitle cell2Text" x="250" y="449" text-anchor="middle">1</text>
    <rect class="neutral" x="284" y="414" width="64" height="54" rx="4"/><text class="small" x="316" y="448" text-anchor="middle">0</text>
    <rect class="cell2" x="350" y="414" width="64" height="54" rx="4"/><text class="subtitle cell2Text" x="382" y="449" text-anchor="middle">1</text>
    <rect class="neutral" x="416" y="414" width="64" height="54" rx="4"/><text class="small" x="448" y="448" text-anchor="middle">0</text>
    <rect class="neutral" x="482" y="414" width="64" height="54" rx="4"/><text class="small" x="514" y="448" text-anchor="middle">0</text>
    <rect class="cell2" x="548" y="414" width="64" height="54" rx="4"/><text class="subtitle cell2Text" x="580" y="449" text-anchor="middle">1</text>
  </g>
  <rect class="neutral" x="90" y="505" width="550" height="48" rx="5"/>
  <text class="small" x="365" y="536" text-anchor="middle">One non-zero incidence entry per particle</text>

  <!-- inter-panel arrow 1 -->
  <path class="arrow" d="M705 310 H744"/>
  <text class="tiny" x="724" y="292" text-anchor="middle">Counting</text>

  <!-- 2. Count and scan -->
  <rect class="panel" x="760" y="40" width="350" height="545" rx="8"/>
  <text class="title" x="790" y="85">2  Counting and scanning</text>
  <text class="label" x="790" y="125">Cell particle count N</text>
  <rect class="neutral" x="790" y="140" width="290" height="60" rx="6"/>
  <text class="array" x="935" y="180" text-anchor="middle">[ 2, 1, 3 ]</text>
  <path class="arrow" d="M935 210 V260"/>
  <text class="small" x="955" y="242">Exclusive prefix sum</text>
  <text class="label" x="790" y="285">Cell offset O</text>
  <rect class="neutral" x="790" y="300" width="290" height="60" rx="6"/>
  <text class="array" x="935" y="340" text-anchor="middle">[ 0, 2, 3, 6 ]</text>
  <path class="arrow" d="M935 370 V415"/>
  <text class="small" x="945" y="400">Write particle IDs by offset</text>
  <text class="label" x="790" y="440">Segmented particle index J</text>
  <rect class="neutral" x="790" y="455" width="290" height="75" rx="6"/>
  <rect class="cell0" x="800" y="465" width="85" height="55" rx="4"/>
  <text class="subtitle cell0Text" x="842" y="500" text-anchor="middle">B E</text>
  <rect class="cell1" x="885" y="465" width="50" height="55" rx="4"/>
  <text class="subtitle cell1Text" x="910" y="500" text-anchor="middle">D</text>
  <rect class="cell2" x="935" y="465" width="135" height="55" rx="4"/>
  <text class="subtitle cell2Text" x="1002" y="500" text-anchor="middle">A C F</text>
  <text class="small" x="935" y="560" text-anchor="middle">O gives the boundaries of each cell segment in J</text>

  <!-- inter-panel arrow 2 -->
  <path class="arrow" d="M1125 310 H1164"/>
  <text class="tiny" x="1144" y="292" text-anchor="middle">Segmented access</text>

  <!-- 3. Compact cell segments -->
  <rect class="panel" x="1180" y="40" width="580" height="545" rx="8"/>
  <text class="title" x="1210" y="85">3  Contiguous cell segments</text>
  <text class="label" x="1210" y="125">Segmented particle index</text>

  <rect class="cell0" x="1210" y="155" width="520" height="100" rx="6"/>
  <text class="subtitle cell0Text" x="1240" y="192">Cell 0</text>
  <text class="small cell0Text" x="1700" y="192" text-anchor="end">[0, 2)</text>
  <text class="array cell0Text" x="1240" y="232">B   E</text>

  <rect class="cell1" x="1210" y="275" width="520" height="100" rx="6"/>
  <text class="subtitle cell1Text" x="1240" y="312">Cell 1</text>
  <text class="small cell1Text" x="1700" y="312" text-anchor="end">[2, 3)</text>
  <text class="array cell1Text" x="1240" y="352">D</text>

  <rect class="cell2" x="1210" y="395" width="520" height="100" rx="6"/>
  <text class="subtitle cell2Text" x="1240" y="432">Cell 2</text>
  <text class="small cell2Text" x="1700" y="432" text-anchor="end">[3, 6)</text>
  <text class="array cell2Text" x="1240" y="472">A   C   F</text>

  <text class="small" x="1470" y="540" text-anchor="middle">Compress the ownership dimension; particle state remains in the particle tensor</text>

  <!-- 4. Thread-block parallelism -->
  <rect class="panel" x="40" y="625" width="1720" height="335" rx="8"/>
  <text class="title" x="70" y="670">4  Thread-block parallelism</text>

  <!-- ordinary cell path -->
  <text class="subtitle" x="90" y="715">Regular cell</text>
  <rect class="cell0" x="90" y="735" width="220" height="62" rx="5"/>
  <text class="small cell0Text" x="110" y="773">Cell 0:B  E</text>
  <path class="arrow" d="M200 804 V835"/>
  <rect x="110" y="842" width="180" height="62" rx="5" fill="#3d8a68"/>
  <text class="subtitle whiteText" x="200" y="880" text-anchor="middle">Block 0</text>
  <text class="small" x="200" y="933" text-anchor="middle">Direct single-segment reduction</text>

  <rect class="cell1" x="360" y="735" width="220" height="62" rx="5"/>
  <text class="small cell1Text" x="380" y="773">Cell 1:D</text>
  <path class="arrow" d="M470 804 V835"/>
  <rect x="380" y="842" width="180" height="62" rx="5" fill="#8063a3"/>
  <text class="subtitle whiteText" x="470" y="880" text-anchor="middle">Block 1</text>

  <path class="guide" d="M650 700 V930"/>

  <!-- heavy cell path -->
  <text class="subtitle" x="700" y="715">High-occupancy cell: contiguous range partitioning</text>
  <rect class="cell2" x="700" y="750" width="270" height="62" rx="5"/>
  <text class="small cell2Text" x="720" y="788">Cell 2:A  C  F</text>

  <path class="arrow" d="M978 781 H1015 V755 H1052"/>
  <path class="arrow" d="M978 781 H1015 V860 H1052"/>

  <rect class="cell2" x="1060" y="724" width="170" height="62" rx="5"/>
  <text class="small cell2Text" x="1145" y="762" text-anchor="middle">Subsegment 0: A  C</text>
  <rect class="cell2" x="1060" y="829" width="170" height="62" rx="5"/>
  <text class="small cell2Text" x="1145" y="867" text-anchor="middle">Subsegment 1: F</text>

  <path class="arrow" d="M1238 755 H1272"/>
  <path class="arrow" d="M1238 860 H1272"/>

  <rect x="1280" y="724" width="170" height="62" rx="5" fill="#4b7fae"/>
  <text class="subtitle whiteText" x="1365" y="762" text-anchor="middle">Block 2</text>
  <rect x="1280" y="829" width="170" height="62" rx="5" fill="#4b7fae"/>
  <text class="subtitle whiteText" x="1365" y="867" text-anchor="middle">Block 3</text>

  <path class="arrow" d="M1458 755 H1490 V797 H1522"/>
  <path class="arrow" d="M1458 860 H1490 V823 H1522"/>
  <rect class="neutral" x="1530" y="772" width="190" height="92" rx="6"/>
  <text class="subtitle" x="1625" y="810" text-anchor="middle">Merge partial moments</text>
  <text class="small" x="1625" y="842" text-anchor="middle">Write cell state</text>

  <text class="small" x="1200" y="937" text-anchor="middle">The partition is set by the high-occupancy threshold H and tile size T</text>
</svg>
