<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #263442; }
      .panel { fill: #ffffff; stroke: #9aa7b5; stroke-width: 2; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .cell2 { fill: #e8f2fa; stroke: #4b7fae; stroke-width: 2; }
      .cell5 { fill: #e9f5ef; stroke: #3d8a68; stroke-width: 2; }
      .cell8 { fill: #f1ecf8; stroke: #8063a3; stroke-width: 2; }
      .neutral { fill: #f5f7f9; stroke: #8795a5; stroke-width: 2; }
      .leader { stroke-width: 4; }
      .cell2Text { fill: #326b9f; }
      .cell5Text { fill: #267253; }
      .cell8Text { fill: #6c4e91; }
      .arrow { fill: none; stroke: #536477; stroke-width: 3; marker-end: url(#arrowhead); }
      .divider { stroke: #9aa7b5; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#536477"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="920" fill="#ffffff"/>

  <!-- Active lanes -->
  <rect class="panel" x="40" y="35" width="1720" height="180" rx="8"/>
  <text class="title" x="70" y="78">1  Active particles in a warp</text>
  <text class="small" x="1725" y="78" text-anchor="end">A warp contains 32 threads; eight active threads are shown</text>

  <g aria-label="eight active lanes">
    <rect class="cell2" x="90" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="177" y="136" text-anchor="middle">Thread 0</text>
    <text class="label cell2Text" x="177" y="166" text-anchor="middle">Cell 2</text>

    <rect class="cell2" x="295" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="382" y="136" text-anchor="middle">Thread 1</text>
    <text class="label cell2Text" x="382" y="166" text-anchor="middle">Cell 2</text>

    <rect class="cell2" x="500" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="587" y="136" text-anchor="middle">Thread 2</text>
    <text class="label cell2Text" x="587" y="166" text-anchor="middle">Cell 2</text>

    <rect class="cell2" x="705" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="792" y="136" text-anchor="middle">Thread 3</text>
    <text class="label cell2Text" x="792" y="166" text-anchor="middle">Cell 2</text>

    <rect class="cell5" x="910" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="997" y="136" text-anchor="middle">Thread 4</text>
    <text class="label cell5Text" x="997" y="166" text-anchor="middle">Cell 5</text>

    <rect class="cell5" x="1115" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="1202" y="136" text-anchor="middle">Thread 5</text>
    <text class="label cell5Text" x="1202" y="166" text-anchor="middle">Cell 5</text>

    <rect class="cell8" x="1320" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="1407" y="136" text-anchor="middle">Thread 6</text>
    <text class="label cell8Text" x="1407" y="166" text-anchor="middle">Cell 8</text>

    <rect class="cell8" x="1525" y="105" width="175" height="78" rx="6"/>
    <text class="subtitle" x="1612" y="136" text-anchor="middle">Thread 7</text>
    <text class="label cell8Text" x="1612" y="166" text-anchor="middle">Cell 8</text>
  </g>

  <path class="arrow" d="M900 220 V248"/>

  <!-- Count comparison -->
  <rect class="panel" x="40" y="255" width="1720" height="285" rx="8"/>
  <text class="title" x="70" y="298">2  Atomic operations during counting</text>
  <line class="divider" x1="890" y1="315" x2="890" y2="515"/>

  <text class="subtitle" x="90" y="342">Per-particle counting</text>
  <text class="small" x="835" y="342" text-anchor="end">Each thread updates its cell counter</text>

  <!-- Naive rows -->
  <text class="label cell2Text" x="90" y="390">Cell 2</text>
  <rect class="cell2" x="180" y="360" width="64" height="44" rx="4"/><text class="tiny" x="212" y="388" text-anchor="middle">Thread 0</text>
  <rect class="cell2" x="254" y="360" width="64" height="44" rx="4"/><text class="tiny" x="286" y="388" text-anchor="middle">Thread 1</text>
  <rect class="cell2" x="328" y="360" width="64" height="44" rx="4"/><text class="tiny" x="360" y="388" text-anchor="middle">Thread 2</text>
  <rect class="cell2" x="402" y="360" width="64" height="44" rx="4"/><text class="tiny" x="434" y="388" text-anchor="middle">Thread 3</text>
  <path class="arrow" d="M478 382 H548"/>
  <rect class="neutral" x="560" y="354" width="245" height="56" rx="5"/>
  <text class="label" x="682" y="389" text-anchor="middle">+1 × 4 (4 operations)</text>

  <text class="label cell5Text" x="90" y="451">Cell 5</text>
  <rect class="cell5" x="180" y="421" width="64" height="44" rx="4"/><text class="tiny" x="212" y="449" text-anchor="middle">Thread 4</text>
  <rect class="cell5" x="254" y="421" width="64" height="44" rx="4"/><text class="tiny" x="286" y="449" text-anchor="middle">Thread 5</text>
  <path class="arrow" d="M330 443 H548"/>
  <rect class="neutral" x="560" y="415" width="245" height="56" rx="5"/>
  <text class="label" x="682" y="450" text-anchor="middle">+1 × 2 (2 operations)</text>

  <text class="label cell8Text" x="90" y="512">Cell 8</text>
  <rect class="cell8" x="180" y="482" width="64" height="44" rx="4"/><text class="tiny" x="212" y="510" text-anchor="middle">Thread 6</text>
  <rect class="cell8" x="254" y="482" width="64" height="44" rx="4"/><text class="tiny" x="286" y="510" text-anchor="middle">Thread 7</text>
  <path class="arrow" d="M330 504 H548"/>
  <rect class="neutral" x="560" y="476" width="245" height="56" rx="5"/>
  <text class="label" x="682" y="511" text-anchor="middle">+1 × 2 (2 operations)</text>

  <!-- Aggregated rows -->
  <text class="subtitle" x="930" y="342">Warp-aggregated counting</text>
  <text class="small" x="1715" y="342" text-anchor="end">Threads for one cell form a group; the leader performs one update</text>

  <rect class="cell2 leader" x="930" y="360" width="390" height="44" rx="4"/>
  <text class="small cell2Text" x="1125" y="388" text-anchor="middle">Thread 0 Thread 1 Thread 2 Thread 3</text>
  <path class="arrow" d="M1332 382 H1392"/>
  <rect class="cell2" x="1405" y="354" width="270" height="56" rx="5"/>
  <text class="label cell2Text" x="1540" y="389" text-anchor="middle">Cell 2: +4 (1 operation)</text>

  <rect class="cell5 leader" x="930" y="421" width="390" height="44" rx="4"/>
  <text class="small cell5Text" x="1125" y="449" text-anchor="middle">Thread 4 Thread 5</text>
  <path class="arrow" d="M1332 443 H1392"/>
  <rect class="cell5" x="1405" y="415" width="270" height="56" rx="5"/>
  <text class="label cell5Text" x="1540" y="450" text-anchor="middle">Cell 5: +2 (1 operation)</text>

  <rect class="cell8 leader" x="930" y="482" width="390" height="44" rx="4"/>
  <text class="small cell8Text" x="1125" y="510" text-anchor="middle">Thread 6 Thread 7</text>
  <path class="arrow" d="M1332 504 H1392"/>
  <rect class="cell8" x="1405" y="476" width="270" height="56" rx="5"/>
  <text class="label cell8Text" x="1540" y="511" text-anchor="middle">Cell 8: +2 (1 operation)</text>

  <!-- Segmented-index reservation -->
  <rect class="panel" x="40" y="580" width="1720" height="300" rx="8"/>
  <text class="title" x="70" y="623">3  Reserve contiguous ranges for segmented indices</text>
  <text class="small" x="1725" y="623" text-anchor="end">The group leader reserves the range; other threads select positions by group order</text>

  <text class="label cell2Text" x="85" y="692">Cell 2 group</text>
  <rect class="cell2 leader" x="190" y="656" width="340" height="56" rx="5"/>
  <text class="label cell2Text" x="360" y="691" text-anchor="middle">Thread 0 Thread 1 Thread 2 Thread 3</text>
  <path class="arrow" d="M542 684 H675"/>
  <rect class="neutral" x="690" y="656" width="300" height="56" rx="5"/>
  <text class="label" x="840" y="691" text-anchor="middle">Reserve four slots in one operation</text>
  <path class="arrow" d="M1002 684 H1115"/>
  <rect class="cell2" x="1130" y="656" width="140" height="56" rx="3"/><text class="small cell2Text" x="1200" y="691" text-anchor="middle">base</text>
  <rect class="cell2" x="1275" y="656" width="140" height="56" rx="3"/><text class="small cell2Text" x="1345" y="691" text-anchor="middle">base+1</text>
  <rect class="cell2" x="1420" y="656" width="140" height="56" rx="3"/><text class="small cell2Text" x="1490" y="691" text-anchor="middle">base+2</text>
  <rect class="cell2" x="1565" y="656" width="140" height="56" rx="3"/><text class="small cell2Text" x="1635" y="691" text-anchor="middle">base+3</text>

  <text class="label cell5Text" x="85" y="762">Cell 5 group</text>
  <rect class="cell5 leader" x="190" y="726" width="340" height="56" rx="5"/>
  <text class="label cell5Text" x="360" y="761" text-anchor="middle">Thread 4 Thread 5</text>
  <path class="arrow" d="M542 754 H675"/>
  <rect class="neutral" x="690" y="726" width="300" height="56" rx="5"/>
  <text class="label" x="840" y="761" text-anchor="middle">Reserve two slots in one operation</text>
  <path class="arrow" d="M1002 754 H1115"/>
  <rect class="cell5" x="1130" y="726" width="285" height="56" rx="3"/><text class="small cell5Text" x="1272" y="761" text-anchor="middle">base</text>
  <rect class="cell5" x="1420" y="726" width="285" height="56" rx="3"/><text class="small cell5Text" x="1562" y="761" text-anchor="middle">base+1</text>

  <text class="label cell8Text" x="85" y="832">Cell 8 group</text>
  <rect class="cell8 leader" x="190" y="796" width="340" height="56" rx="5"/>
  <text class="label cell8Text" x="360" y="831" text-anchor="middle">Thread 6 Thread 7</text>
  <path class="arrow" d="M542 824 H675"/>
  <rect class="neutral" x="690" y="796" width="300" height="56" rx="5"/>
  <text class="label" x="840" y="831" text-anchor="middle">Reserve two slots in one operation</text>
  <path class="arrow" d="M1002 824 H1115"/>
  <rect class="cell8" x="1130" y="796" width="285" height="56" rx="3"/><text class="small cell8Text" x="1272" y="831" text-anchor="middle">base</text>
  <rect class="cell8" x="1420" y="796" width="285" height="56" rx="3"/><text class="small cell8Text" x="1562" y="831" text-anchor="middle">base+1</text>
</svg>
