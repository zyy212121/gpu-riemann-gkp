<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" style="background:#ffffff">
  <title>GPU execution hierarchy and two-phase data mapping</title>
  <desc>The upper panel shows the Thread grid, Block, Warp, SM, and Device memory hierarchy; the lower panel shows the parallel mapping of Cells, Mesh faces, Particles, and CP-CST.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0L9 4L0 8Z" fill="#27364a"/>
    </marker>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC","SimHei",sans-serif;fill:#172033}
      .h{font-size:29px;font-weight:600}.m{font-size:23px;font-weight:500}.s{font-size:19px}
      .ln{fill:none;stroke:#27364a;stroke-width:2.2}.ar{fill:none;stroke:#27364a;stroke-width:2.2;marker-end:url(#a)}
      .g{fill:#f7f8fa;stroke:#65758b;stroke-width:2}.b{fill:#eaf2fa;stroke:#276aa8;stroke-width:2}
      .o{fill:#fff2e5;stroke:#bc681b;stroke-width:2}.p{fill:#f2edfa;stroke:#7650a3;stroke-width:2}
      .w{fill:#fff;stroke:#65758b;stroke-width:1.8}.gr{fill:#eaf5ef;stroke:#2c805a;stroke-width:2}
    </style>
  </defs>
  <rect x="0" y="0" width="1800" height="980" fill="#ffffff"/>

  <!-- GPU execution hierarchy -->
  <text class="t h" x="55" y="48">GPU execution hierarchy</text>
  <line class="ln" x1="55" y1="62" x2="1745" y2="62" opacity=".35"/>

  <rect class="g" x="55" y="90" width="760" height="325" rx="8"/>
  <text class="t m" x="78" y="124">Thread grid</text>

  <g transform="translate(85 145)">
    <rect class="b" width="325" height="230" rx="8"/>
    <text class="t m" x="18" y="35">Block 0</text>
    <rect class="w" x="20" y="55" width="285" height="78" rx="6"/>
    <text class="t s" x="34" y="83">Warp 0</text>
    <g transform="translate(35 96)" fill="#cfe2f4" stroke="#276aa8">
      <rect width="20" height="20"/><rect x="24" width="20" height="20"/><rect x="48" width="20" height="20"/><rect x="72" width="20" height="20"/>
      <rect x="96" width="20" height="20"/><rect x="120" width="20" height="20"/><rect x="144" width="20" height="20"/><rect x="168" width="20" height="20"/>
      <rect x="192" width="20" height="20"/><rect x="216" width="20" height="20"/><rect x="240" width="20" height="20"/>
    </g>
    <text class="t s" x="238" y="83">×32</text>
    <rect class="w" x="20" y="150" width="125" height="52" rx="5"/><text class="t s" x="39" y="182">Registers</text>
    <rect class="gr" x="160" y="150" width="145" height="52" rx="5"/><text class="t s" x="184" y="182">Shared memory</text>
  </g>

  <g transform="translate(445 145)">
    <rect class="b" width="325" height="230" rx="8"/>
    <text class="t m" x="18" y="35">Block 1</text>
    <rect class="w" x="20" y="55" width="285" height="78" rx="6"/>
    <text class="t s" x="34" y="83">Warp 0</text>
    <g transform="translate(35 96)" fill="#cfe2f4" stroke="#276aa8">
      <rect width="20" height="20"/><rect x="24" width="20" height="20"/><rect x="48" width="20" height="20"/><rect x="72" width="20" height="20"/>
      <rect x="96" width="20" height="20"/><rect x="120" width="20" height="20"/><rect x="144" width="20" height="20"/><rect x="168" width="20" height="20"/>
      <rect x="192" width="20" height="20"/><rect x="216" width="20" height="20"/><rect x="240" width="20" height="20"/>
    </g>
    <text class="t s" x="238" y="83">×32</text>
    <rect class="w" x="20" y="150" width="125" height="52" rx="5"/><text class="t s" x="39" y="182">Registers</text>
    <rect class="gr" x="160" y="150" width="145" height="52" rx="5"/><text class="t s" x="184" y="182">Shared memory</text>
  </g>

  <text class="t h" x="835" y="275">···</text>
  <path class="ar" d="M815 180H910V145H1000"/>
  <path class="ar" d="M815 335H910V350H1000"/>

  <g transform="translate(1000 105)">
    <rect class="o" width="260" height="145" rx="8"/>
    <text class="t h" x="101" y="43">SM 0</text>
    <g transform="translate(28 65)" fill="#f7d8b5" stroke="#bc681b">
      <rect width="38" height="38"/><rect x="45" width="38" height="38"/><rect x="90" width="38" height="38"/><rect x="135" width="38" height="38"/><rect x="180" width="38" height="38"/>
    </g>
    <text class="t s" x="60" y="130">Concurrent warp execution</text>
  </g>
  <g transform="translate(1000 290)">
    <rect class="o" width="260" height="145" rx="8"/>
    <text class="t h" x="101" y="43">SM 1</text>
    <g transform="translate(28 65)" fill="#f7d8b5" stroke="#bc681b">
      <rect width="38" height="38"/><rect x="45" width="38" height="38"/><rect x="90" width="38" height="38"/><rect x="135" width="38" height="38"/><rect x="180" width="38" height="38"/>
    </g>
    <text class="t s" x="60" y="130">Concurrent warp execution</text>
  </g>
  <g transform="translate(1380 198)">
    <rect class="o" width="245" height="145" rx="8"/>
    <text class="t h" x="93" y="45">SM n</text>
    <g transform="translate(24 66)" fill="#f7d8b5" stroke="#bc681b">
      <rect width="36" height="36"/><rect x="42" width="36" height="36"/><rect x="84" width="36" height="36"/><rect x="126" width="36" height="36"/><rect x="168" width="36" height="36"/>
    </g>
    <text class="t s" x="53" y="130">Resident thread blocks</text>
  </g>

  <rect class="p" x="915" y="465" width="710" height="72" rx="7"/>
  <text class="t m" x="1000" y="509">Device memory</text>
  <g transform="translate(1100 484)">
    <rect class="w" width="95" height="34"/><rect class="w" x="110" width="95" height="34"/><rect class="w" x="220" width="120" height="34"/><rect class="w" x="355" width="130" height="34"/>
    <text class="t s" x="15" y="24">Mesh fields</text><text class="t s" x="125" y="24">Particles</text><text class="t s" x="235" y="24">CP-CST</text><text class="t s" x="370" y="24">Intermediate quantities</text>
  </g>
  <path class="ar" d="M1260 177H1330V450H1280V460"/><path class="ar" d="M1130 435V460"/><path class="ar" d="M1502 343V460"/>

  <!-- Data mapping -->
  <text class="t h" x="55" y="605">Two-phase data mapping</text>
  <line class="ln" x1="55" y1="620" x2="1745" y2="620" opacity=".35"/>

  <!-- cell: rectangular data elements mapped to rectangular threads -->
  <g transform="translate(65 660)">
    <text class="t m" x="132" y="0">Cell</text>
    <g transform="translate(0 34)">
      <rect class="b" x="0" width="72" height="56"/><rect class="b" x="76" width="72" height="56"/><rect class="b" x="152" width="72" height="56"/><rect class="b" x="228" width="72" height="56"/>
      <text class="t s" x="27" y="35">0</text><text class="t s" x="103" y="35">1</text><text class="t s" x="179" y="35">2</text><text class="t s" x="255" y="35">3</text>
    </g>
    <path class="ar" d="M36 96V151"/><path class="ar" d="M112 96V151"/><path class="ar" d="M188 96V151"/><path class="ar" d="M264 96V151"/>
    <g transform="translate(0 160)">
      <rect class="b" x="0" width="72" height="50" rx="5"/><rect class="b" x="76" width="72" height="50" rx="5"/><rect class="b" x="152" width="72" height="50" rx="5"/><rect class="b" x="228" width="72" height="50" rx="5"/>
      <text class="t s" x="17" y="32">Thread</text><text class="t s" x="93" y="32">Thread</text><text class="t s" x="169" y="32">Thread</text><text class="t s" x="245" y="32">Thread</text>
    </g>
    <text class="t s" x="92" y="253">One thread per cell</text>
  </g>

  <!-- face -->
  <g transform="translate(455 660)">
    <text class="t m" x="113" y="0">Mesh faces</text>
    <g transform="translate(0 34)">
      <rect class="gr" x="0" width="72" height="56"/><rect class="gr" x="76" width="72" height="56"/><rect class="gr" x="152" width="72" height="56"/><rect class="gr" x="228" width="72" height="56"/>
      <text class="t s" x="27" y="35">0</text><text class="t s" x="103" y="35">1</text><text class="t s" x="179" y="35">2</text><text class="t s" x="255" y="35">3</text>
    </g>
    <path class="ar" d="M36 96V151"/><path class="ar" d="M112 96V151"/><path class="ar" d="M188 96V151"/><path class="ar" d="M264 96V151"/>
    <g transform="translate(0 160)">
      <rect class="gr" x="0" width="72" height="50" rx="5"/><rect class="gr" x="76" width="72" height="50" rx="5"/><rect class="gr" x="152" width="72" height="50" rx="5"/><rect class="gr" x="228" width="72" height="50" rx="5"/>
      <text class="t s" x="17" y="32">Thread</text><text class="t s" x="93" y="32">Thread</text><text class="t s" x="169" y="32">Thread</text><text class="t s" x="245" y="32">Thread</text>
    </g>
    <text class="t s" x="82" y="253">One thread per mesh face</text>
  </g>

  <!-- particle -->
  <g transform="translate(835 660)">
    <text class="t m" x="112" y="0">Particle tensor</text>
    <g transform="translate(0 34)">
      <rect class="o" x="0" width="72" height="56"/><rect class="o" x="76" width="72" height="56"/><rect class="o" x="152" width="72" height="56"/><rect class="o" x="228" width="72" height="56"/>
      <text class="t s" x="27" y="35">0</text><text class="t s" x="103" y="35">1</text><text class="t s" x="179" y="35">2</text><text class="t s" x="255" y="35">3</text>
    </g>
    <path class="ar" d="M36 96V151"/><path class="ar" d="M112 96V151"/><path class="ar" d="M188 96V151"/><path class="ar" d="M264 96V151"/>
    <g transform="translate(0 160)">
      <rect class="o" x="0" width="72" height="50" rx="5"/><rect class="o" x="76" width="72" height="50" rx="5"/><rect class="o" x="152" width="72" height="50" rx="5"/><rect class="o" x="228" width="72" height="50" rx="5"/>
      <text class="t s" x="17" y="32">Thread</text><text class="t s" x="93" y="32">Thread</text><text class="t s" x="169" y="32">Thread</text><text class="t s" x="245" y="32">Thread</text>
    </g>
    <text class="t s" x="93" y="253">One thread per particle</text>
  </g>

  <!-- CP-CST: every relation is an arrowed mapping -->
  <g transform="translate(1225 650)">
    <text class="t m" x="150" y="10">CP-CST</text>
    <g transform="translate(0 34)">
      <rect class="b" x="0" width="55" height="56"/><rect class="b" x="57" width="55" height="56"/>
      <rect class="o" x="124" width="55" height="56"/><rect class="o" x="181" width="55" height="56"/><rect class="o" x="238" width="55" height="56"/>
      <rect class="p" x="305" width="55" height="56"/>
      <text class="t s" x="19" y="35">0</text><text class="t s" x="76" y="35">0</text><text class="t s" x="143" y="35">1</text><text class="t s" x="200" y="35">1</text><text class="t s" x="257" y="35">1</text><text class="t s" x="324" y="35">2</text>
    </g>
    <path class="ar" d="M56 96V151"/>
    <path class="ar" d="M208 96V126H174V151"/>
    <path class="ar" d="M208 96V126H292V151"/>
    <path class="ar" d="M332 96V126H410V151"/>
    <g transform="translate(0 160)">
      <rect class="b" x="0" width="112" height="50" rx="5"/><rect class="o" x="118" width="112" height="50" rx="5"/><rect class="o" x="236" width="112" height="50" rx="5"/><rect class="p" x="354" width="112" height="50" rx="5"/>
      <text class="t s" x="25" y="32">Block</text><text class="t s" x="143" y="32">Block</text><text class="t s" x="261" y="32">Block</text><text class="t s" x="379" y="32">Block</text>
    </g>
    <text class="t s" x="35" y="253">Cell segment</text><text class="t s" x="175" y="253">High-occupancy cell partition</text><text class="t s" x="380" y="253">Cell segment</text>
  </g>
</svg>
